<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>키즈 플레이</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e8f8ff,#fff3dd);font-family:system-ui,'Noto Sans KR',sans-serif;color:#28354d;user-select:none}button,select{font:inherit;touch-action:manipulation}button{cursor:pointer;border:0;border-radius:18px;background:white;padding:12px 18px;box-shadow:0 4px 0 #cbd8e3;font-weight:800;color:#334}button:active{transform:translateY(3px);box-shadow:0 1px 0 #cbd8e3}.wrap{max-width:1150px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:clamp(25px,4vw,44px);font-weight:900;margin:8px 0}.muted{color:#617089}.menu{display:flex;gap:20px;justify-content:center;margin-top:7vh}.tile{width:42%;min-height:220px;font-size:clamp(25px,3.4vw,38px);background:white}.tile span{display:block;font-size:70px}.panel{background:#ffffffc9;border-radius:24px;padding:15px;margin-top:12px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary{background:#6a8dff;color:white}.pink{background:#ff8caa;color:white}.cards{display:grid;gap:7px;margin:10px auto;max-width:min(96vw,900px)}.memory-card{display:grid;place-items:center;min-height:42px;aspect-ratio:1.4;background:#85b8ff;border-radius:13px;font-size:clamp(19px,3vw,42px);box-shadow:0 3px 0 #5389ce}.memory-card.open{background:#fff}.memory-card.matched{background:#c4f5d2;opacity:.7}.stat{font-size:22px;font-weight:900}.hidden{display:none!important}.question{text-align:center;font-size:clamp(30px,4vw,48px);font-weight:900}.objects{text-align:center;font-size:clamp(35px,5vw,65px);min-height:85px;overflow-wrap:anywhere}.answers{display:flex;justify-content:center;gap:20px}.answer{font-size:clamp(28px,4vw,48px);min-width:100px;background:#fff}.feedback{text-align:center;min-height:50px;font-size:30px;font-weight:900}.small{font-size:14px}select{padding:10px;border-radius:12px;border:1px solid #b8c9df;background:white}.footer{text-align:center;color:#64738b;font-size:13px;margin:12px}#overlay{position:fixed;inset:0;background:#24335a99;display:grid;place-items:center;z-index:10}#overlay>div{background:white;padding:30px;border-radius:24px;text-align:center;max-width:85vw}#overlay h2{font-size:36px}@media(max-height:650px){.wrap{padding:8px}.panel{padding:9px}.cards{gap:4px;margin:6px auto}.memory-card{aspect-ratio:1.6}.menu{margin-top:3vh}.tile{min-height:170px}}
</style></head><body><div class="wrap"><header class="top"><div class="title">🌈 키즈 플레이</div><button id="home" class="hidden" onclick="goHome()">🏠 홈으로</button></header><section id="menu"><div class="muted">재미있게 놀면서 배우는 우리 아이 게임</div><div class="menu"><button class="tile" onclick="startMemory()"><span>🐻🦊</span>메모리 게임</button><button class="tile" onclick="startMath()"><span>🍎🔢</span>숫자 공부</button></div></section><section id="memory" class="hidden"><div class="panel"><div class="controls"><label>난이도 <select id="level"><option value="4">4×4</option><option value="5">5×5</option><option value="6">6×6</option></select></label><label>그림 <select id="theme"><option value="random">랜덤</option><option value="animals">동물</option><option value="fruit">과일</option><option value="cars">탈것</option></select></label><button class="primary" onclick="newMemory()">🔄 다시 시작</button><button onclick="pauseMemory()" id="pause">⏸ 일시정지</button><button class="pink" onclick="hint()" id="hint">💡 힌트 (2)</button><span class="stat" id="timer">⏱ 00:00</span><span id="moves">시도 0</span></div><div id="cards" class="cards"></div><div class="small" id="rank"></div></div></section><section id="math" class="hidden"><div class="panel"><div class="controls"><label>공부 선택 <select id="mathMode" onchange="newMath()"><option value="count">그림 숫자 세기</option><option value="number">숫자 찾기</option><option value="add">덧셈</option><option value="sub">뺄셈</option></select></label><button class="primary" onclick="newMath()">🔄 새 문제</button><span class="stat" id="score">⭐ 0점</span></div><div class="question" id="question"></div><div class="objects" id="objects"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div></section><div class="footer">인터넷 없이 사용 가능 · 기록은 이 기기에 저장됩니다</div></div><div id="overlay" class="hidden"><div><h2 id="overlayTitle"></h2><p id="overlayText"></p><button class="primary" onclick="closeOverlay()">확인</button></div></div><script>
const $=id=>document.getElementById(id);let mode='menu',deck=[],opened=[],matched=0,moves=0,hints=2,elapsed=0,paused=false,lock=false,clock=null,score=0,correct=0,mathBusy=false;const groups={animals:['🐻','🦊','🐶','🐱','🐼','🐸','🐰','🐯','🦁','🐵','🐨','🐷','🐮','🐹','🐙','🐧','🦄','🐢'],fruit:['🍎','🍌','🍇','🍓','🍉','🍊','🍍','🥝','🍒','🍑','🥭','🍐','🍋','🥥','🫐','🍈','🥑','🍅'],cars:['🚗','🚕','🚌','🚒','🚑','🚓','🚜','🚲','🚀','✈️','🚁','🚢','🚂','🛵','🚤','🚚','🚠','🛸']};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(section){['menu','memory','math'].forEach(x=>$(x).classList.toggle('hidden',x!==section));$('home').classList.toggle('hidden',section==='menu');mode=section}function goHome(){clearInterval(clock);show('menu')}function sound(ok=true){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:220;g.gain.value=.07;o.start();o.stop(c.currentTime+.14);o.onended=()=>c.close()}catch(e){}}function popup(t,s){$('overlayTitle').textContent=t;$('overlayText').textContent=s;$('overlay').classList.remove('hidden')}function closeOverlay(){$('overlay').classList.add('hidden')}function startMemory(){show('memory');newMemory()}function newMemory(){clearInterval(clock);let n=+$('level').value,total=n*n,pairs=Math.floor(total/2),pool=$('theme').value==='random'?Object.values(groups).flat():groups[$('theme').value];let symbols=shuffle(pool).slice(0,pairs);deck=shuffle(symbols.flatMap((s,i)=>[{symbol:s,id:i},{symbol:s,id:i}]));if(total%2)deck.push({symbol:'⭐',id:-1,bonus:true});opened=[];matched=0;moves=0;hints=2;elapsed=0;paused=false;lock=false;$('pause').textContent='⏸ 일시정지';$('hint').textContent='💡 힌트 (2)';$('moves').textContent='시도 0';updateTimer();let grid=$('cards');grid.style.gridTemplateColumns=`repeat(${n},1fr)`;grid.innerHTML='';deck.forEach((c,i)=>{let b=document.createElement('button');b.className='memory-card';b.textContent=c.bonus?'⭐':'❔';b.onclick=()=>flip(i);grid.appendChild(b)});rank();clock=setInterval(()=>{if(!paused){elapsed++;updateTimer()}},1000)}function updateTimer(){let m=String(Math.floor(elapsed/60)).padStart(2,'0'),s=String(elapsed%60).padStart(2,'0');$('timer').textContent=`⏱ ${m}:${s}`}function flip(i){if(paused||lock||opened.includes(i)||deck[i].done||deck[i].bonus)return;let b=$('cards').children[i];b.classList.add('open');b.textContent=deck[i].symbol;opened.push(i);if(opened.length===2){moves++;$('moves').textContent=`시도 ${moves}`;let[a,z]=opened;if(deck[a].id===deck[z].id){deck[a].done=deck[z].done=true;[$('cards').children[a],$('cards').children[z]].forEach(x=>x.classList.add('matched'));opened=[];matched+=2;sound();if(matched>=deck.length-(deck.length%2))finishMemory()}else{lock=true;setTimeout(()=>{[a,z].forEach(k=>{if(!deck[k].done){let el=$('cards').children[k];el.classList.remove('open');el.textContent='❔'}});opened=[];lock=false},850)}}}function finishMemory(){clearInterval(clock);let key='kidsplay_rank_'+$('level').value;let scores=JSON.parse(localStorage.getItem(key)||'[]');scores.push(elapsed);scores.sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(scores.slice(0,10)));rank();popup('🎉 참 잘했어요!','완료 시간 '+$('timer').textContent.replace('⏱ ','')+' · 시도 '+moves+'번')}function rank(){let scores=JSON.parse(localStorage.getItem('kidsplay_rank_'+$('level').value)||'[]');$('rank').textContent='🏆 최고 기록: '+(scores.length?scores.map((s,i)=>`${i+1}위 ${Math.floor(s/60)}분 ${s%60}초`).join(' · '):'아직 기록이 없어요')}function pauseMemory(){paused=!paused;$('pause').textContent=paused?'▶ 계속하기':'⏸ 일시정지';Array.from($('cards').children).forEach((el,i)=>el.style.visibility=paused&&!deck[i].done?'hidden':'visible')}function hint(){if(paused||lock||hints<=0||opened.length)return;hints--;$('hint').textContent=`💡 힌트 (${hints})`;lock=true;let els=[...$('cards').children];els.forEach((e,i)=>{if(!deck[i].done&&!deck[i].bonus){e.textContent=deck[i].symbol;e.classList.add('open')}});setTimeout(()=>{els.forEach((e,i)=>{if(!deck[i].done&&!deck[i].bonus){e.textContent='❔';e.classList.remove('open')}});lock=false},1400)}function startMath(){show('math');score=0;$('score').textContent='⭐ 0점';newMath()}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function newMath(){mathBusy=false;$('feedback').textContent='';let m=$('mathMode').value,a=rnd(1,10),b=rnd(1,9);$('objects').textContent='';if(m==='count'){correct=a;$('question').textContent='몇 개일까요?';$('objects').textContent=Array(a).fill(['🍎','🐣','⭐','🍓','🚗'][rnd(0,4)]).join(' ')}else if(m==='number'){correct=a;$('question').textContent='숫자 '+a+'을(를) 찾아보세요!'}else if(m==='add'){a=rnd(1,9);b=rnd(1,10-a);correct=a+b;$('question').textContent=`${a} + ${b} = ?`}else{a=rnd(2,10);b=rnd(1,a);correct=a-b;$('question').textContent=`${a} − ${b} = ?`}let opts=new Set([correct]);while(opts.size<3)opts.add(Math.max(0,Math.min(20,correct+rnd(-5,5))));$('answers').innerHTML='';shuffle([...opts]).forEach(v=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.onclick=()=>answer(v);$('answers').appendChild(btn)})}function answer(v){if(mathBusy)return;if(v===correct){mathBusy=true;score+=10;$('score').textContent=`⭐ ${score}점`;$('feedback').textContent='🎉 정답! 정말 잘했어요!';sound();setTimeout(()=>{if(mode==='math')newMath()},1000)}else{$('feedback').textContent='💛 다시 한번 생각해 봐요!';sound(false)}}$('level').addEventListener('change',()=>{if(mode==='memory')newMemory()});$('theme').addEventListener('change',()=>{if(mode==='memory')newMemory()});
</script></body></html>
