n.selected{border-color:#537cff;background:#e1ebff;color:#3158be}.setupStart{align-self:center;width:min(80%,400px);font-size:clamp(18px,4vh,30px);padding:clamp(8px,2vh,17px)}.panel{height:100%;min-height:0;background:#ffffffc9;border-radius:20px;padding:clamp(5px,1vh,12px);display:flex;flex-direction:column;gap:clamp(4px,1vh,9px)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}.controls label{font-weight:800;font-size:clamp(12px,2.3vh,17px)}select{padding:6px;border-radius:9px;border:1px solid #b5c6dd;background:white}.stat{font-weight:900;font-size:clamp(14px,3vh,23px)}.cards{flex:1;min-height:0;min-width:0;display:grid;gap:clamp(3px,.7vh,7px);margin:auto;aspect-ratio:auto;width:min(100%,calc((100dvh - 135px)*1.45));max-width:100%;grid-template-rows:repeat(var(--n),minmax(0,1fr))}.memory-card{min-width:0;min-height:0;padding:0;display:grid;place-items:center;background:#81b8ff;border-radius:clamp(6px,1.5vh,14px);font-size:clamp(17px,5.4vh,43px);box-shadow:0 2px 0 #5086c9}.memory-card.open{background:#fff}.memory-card.matched{background:#c5f5d5}.rank{flex:none;max-height:clamp(35px,9vh,78px);overflow:auto;font-size:clamp(11px,2vh,16px);font-weight:700}.question{font-size:clamp(24px,5vh,46px);font-weight:1000;text-align:center}.objects{font-size:clamp(29px,7vh,61px);text-align:center;line-height:1.5;max-width:90%;margin:auto}.answers{display:flex;justify-content:center;gap:clamp(9px,2vw,24px);flex-wrap:wrap}.answer{min-width:clamp(80px,13vw,145px);font-size:clamp(21px,4vh,37px);padding:clamp(9px,2vh,18px)}.feedback{text-align:center;font-size:clamp(19px,4vh,32px);font-weight:900;min-height:1.4em}.playArea{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;min-height:0}.choice{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.progress{font-weight:900;font-size:clamp(15px,3vh,22px)}.illustration{font-size:clamp(45px,15vh,120px);line-height:1.2;filter:drop-shadow(0 5px 2px # k="openCollection()">🧸 장난감 도감</button><button id="home" class="hidden" onclick="goHome()">🏠 홈으로</button></div></header>

 class="primary setupStart" onclick="playMath()">▶ 게임 시작</button></div></section><section id="math" class="hidden"><div class="panel"><div class="controls"><button onclick="openMathSetup()">⬅ 놀이 선택</button><label class="hidden">놀이 <select id="mathMode" onchange="newMathRound()"><option value="count">그림 숫자 세기</option><option value="add">덧셈</option><option value="sub">뺄셈</option></select></label><label class="hidden">숫자 범위 <select id="mathRange" onchange="newMathRound()"><option value="5">1~5</option><option value="10" selected>1~10</option><option value="20">1~20</option><option value="100">1~100</option></select></label><button onclick="newMathRound()">🔄 처음부터</button><span class="progress" id="mathProgress">문제 1 / 10</span></div><div class="playArea"><div class="question" id="question"></div><div class="objects" id="objects"></div><div class="answers" id="answers"></div><div class="feedback" id="mathFeedback"></div></div></div></section>

게임 가능 · 기록은 이 기기에 저장됩니다 · 한국어 음성은 기기 지원 여부에 따라 달라집니다</div></div>

<script>
const $=id=>document.getElementById(id);let mode='menu',clock=null,elapsed=0,deck=[],opened=[],matched=0,moves=0,hints=2,paused=false,lock=false,session=0,round=0,correct=0,busy=false,soundOn=true,audioCtx=null,korItem=null,korAnswer='',korPool=[];
const groups={animals:['🐻','🦊','🐶','🐱','🐼','🐸','🐰','🐯','🦁','🐵','🐨','🐷','🐮','🐹','🐙','🐧','🦄','🐢'],fruit:['🍎','🍌','🍇','🍓','🍉','🍊','🍍','🥝','🍒','🍑','🥭','🍐','🍋','🥥','🫐','🍈','🥑','🍅'],cars:['🚗','🚕','🚌','🚒','🚑','🚓','🚜','🚲','🚀','✈️','🚁','🚢','🚂','🛵','🚤','🚚','🚠','🛸']};
const words=[
['사과','🍎','fruit','easy'],['포도','🍇','fruit','easy'],['바나나','🍌','fruit','easy'],['수박','🍉','fruit','normal'],['딸기','🍓','fruit','normal'],['복숭아','🍑','fruit','hard'],['파인애플','🍍','fruit','hard'],
['토끼','🐰','animal','normal'],['사자','🦁','animal','easy'],['나비','🦋','animal','easy'],['여우','🦊','animal','easy'],['돼지','🐷','animal','normal'],['고양이','🐱','animal','normal'],['코끼리','🐘','animal','hard'],['호랑이','🐯','animal','hard'],['거북이','🐢','animal','hard'],
['기차','🚂','vehicle','easy'],['버스','🚌','vehicle','normal'],['택시','🚕','vehicle','normal'],['자동차','🚗','vehicle','hard'],['비행기','✈️','vehicle','hard'],['자전거','🚲','vehicle','hard'],['배','🚢','vehicle','easy'],
['의자','🪑','object','easy'],['시계','⏰','object','easy'],['모자','🧢','object','easy'],['우산','☂️','object','normal'],['가방','🎒','object','normal'],['장난감','🧸','object','hard'],['컴퓨터','💻','object','hard'],
['우유','🥛','food','easy'],['피자','🍕','food','easy'],['빵','🍞','food','easy'],['김밥','🍙','food','normal'],['사탕','🍬','food','normal'],['햄버거','🍔','food','hard'],['아이스크림','🍦','food','hard']];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function show(s){session++;clearInterval(clock);if(window.speechSynthesis)window.speechSynthesis.cancel();if(window.KidsVoice)window.KidsVoice.stop();['menu','memory','math','mathSetup','korean','koreanSetup','puzzleSelect','puzzlePlay'].forEach(x=>$(x).classList.toggle('hidden',x!==s));$('home').classList.toggle('hidden',s==='menu');mode=s}function goHome(){if(mode==='puzzlePlay')savePuzzle();show('menu');closeOverlay()}function toggleSound(){soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';if(!soundOn){if(window.speechSynthesis)window.speechSynthesis.cancel();if(window.KidsVoice)window.KidsVoice.stop()}}
function tone(f,t,d=.10,type='sine',vol=.055){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,audioCtx.currentTime+t);g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+t+.012);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+d);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+d+.01)}catch(e){}}
function sfx(k){if(k==='flip')tone(490,0,.07,'sine',.035);if(k==='match'){tone(660,0,.12);tone(880,.10,.19)}if(k==='wrong'){tone(350,0,.10,'sine',.025);tone(280,.10,.12,'sine',.02)}if(k==='right'){tone(620,0,.11);tone(840,.11,.20)}if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.15,.25,'triangle',.05))}}
function popup(t,s,celebrate=false){$('overlayTitle').textContent=t;$('overlayText').textContent=s;$('overlay').classList.remove('hidden');if(celebrate){sfx('win');confetti()}}function closeOverlay(){$('overlay').classList.add('hidden')}function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<65;i++){let e=document.createElement('div');e.className='piece';e.style.left=rnd(0,100)+'%';e.style.background=['#ff78a9','#ffcd4c','#6bc9ff','#82e3a4','#bba1ff'][i%5];e.style.animationDelay=(Math.random()*.7)+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',3600)}
function startMemory(){show('memory');newMemory()}function newMemory(){session++;clearInterval(clock);let n=+$('level').value,cols=n===5?5:n,rows=n===5?4:n,pool=$('theme').value==='random'?Object.values(groups).flat():groups[$('theme').value],pairs=rows*cols/2;let symbols=shuffle(pool).slice(0,pairs);deck=shuffle(symbols.flatMap((s,i)=>[{symbol:s,id:i},{symbol:s,id:i}]));if(n%2)deck.push({symbol:'⭐',id:-1,bonus:true});opened=[];matched=0;moves=0;hints=2;elapsed=0;paused=false;lock=false;$('pause').textContent='⏸ 일시정지';$('hint').textContent='💡 힌트 (2)';$('moves').textContent='시도 0';updateTimer();let grid=$('cards');grid.style.setProperty('--n',rows);grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';grid.innerHTML='';deck.forEach((c,i)=>{let b=document.createElement('button');b.className='memory-card';b.textContent=c.bonus?'⭐':'❔';b.onclick=()=>flip(i);grid.appendChild(b)});rank();clock=setInterval(()=>{if(!paused){elapsed++;updateTimer()}},1000)}
function updateTimer(){$('timer').textContent='⏱ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}
function flip(i){if(paused||lock||opened.includes(i)||deck[i].done||deck[i].bonus)return;sfx('flip');let b=$('cards').children[i];b.classList.add('open');b.textContent=deck[i].symbol;opened.push(i);if(opened.length===2){moves++;$('moves').textContent='시도 '+moves;let[a,z]=opened;if(deck[a].id===deck[z].id){deck[a].done=deck[z].done=true;[$('cards').children[a],$('cards').children[z]].forEach(x=>x.classList.add('matched'));opened=[];matched+=2;sfx('match');if(matched>=deck.length-(deck.length%2))finishMemory()}else{lock=true;sfx('wrong');let token=session;setTimeout(()=>{if(token!==session)return;[a,z].forEach(k=>{if(!deck[k].done){let el=$('cards').children[k];el.classList.remove('open');el.textContent='❔'}});opened=[];lock=false},750)}}}
function finishMemory(){clearInterval(clock);let key='kidsplay_rank_'+$('level').value;let scores=[];try{scores=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}scores.push(elapsed);scores.sort((a,b)=>a-b);scores=scores.slice(0,5);localStorage.setItem(key,JSON.stringify(scores));rank();awardGame('🏆 메모리 게임 성공!','완료 시간 '+$('timer').textContent.replace('⏱ ','')+' · 시도 '+moves+'번')}
function rank(){let scores=[];try{scores=JSON.parse(localStorage.getItem('kidsplay_rank_'+$('level').value)||'[]')}catch(e){}$('rank').textContent='🏆 '+$('level').value+'×'+($('level').value==='5'?'4×5':$('level').value)+' TOP 5 · '+(scores.length?scores.slice(0,5).map((s,i)=>(i+1)+'위 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')).join('　　'):'아직 기록이 없어요')}
function pauseMemory(){if(lock)return;paused=!paused;$('pause').textContent=paused?'▶ 계속하기':'⏸ 일시정지';[...$('cards').children].forEach((el,i)=>el.style.visibility=paused&&!deck[i].done?'hidden':'visible')}
function hint(){if(paused||lock||hints<=0)return;hints--;paused=true;$('hint').textContent='💡 힌트 ('+hints+')';lock=true;let token=session,els=[...$('cards').children];els.forEach((e,i)=>{if(!deck[i].done&&!deck[i].bonus){e.textContent=deck[i].symbol;e.classList.add('open')}});setTimeout(()=>{if(token!==session)return;els.forEach((e,i)=>{if(!deck[i].done&&!deck[i].bonus&&!opened.includes(i)){e.textContent='❔';e.classList.remove('open')}});paused=false;lock=false},2000)}
function pickSetup(id,value){$(id).value=value;let parent=id==='mathMode'?'mathTypes':id==='mathRange'?'mathRanges':id==='korMode'?'korTypes':'korLevels';[...$(parent).children].forEach(b=>b.classList.toggle('selected',b.dataset.value===value))}function openMathSetup(){show('mathSetup')}function playMath(){show('math');newMathRound()}function startMath(){openMathSetup()}function newMathRound(){session++;round=0;nextMath()}function nextMath(){busy=false;$('mathFeedback').textContent='';$('mathProgress').textContent='문제 '+(round+1)+' / 10';let max=+$('mathRange').value,m=$('mathMode').value,a,b;if(m==='count'){a=rnd(1,max);correct=a;$('question').textContent='몇 개일까요?';$('objects').textContent=Array(a).fill(['🍎','🐣','⭐','🍓','🚗'][rnd(0,4)]).join(' ');$('objects').style.fontSize=max>20?'clamp(12px,2.5vh,25px)':''}else{ $('objects').textContent='';$('objects').style.fontSize='';if(m==='add'){a=rnd(1,max-1);b=rnd(1,max-a);correct=a+b;$('question').textContent=a+' + '+b+' = ?'}else{a=rnd(1,max);b=rnd(1,a);correct=a-b;$('question').textContent=a+' − '+b+' = ?'}}let opts=new Set([correct]);while(opts.size<3)opts.add(rnd(0,max));$('answers').innerHTML='';shuffle([...opts]).forEach(v=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.onclick=()=>answerMath(v);$('answers').appendChild(btn)})}
function answerMath(v){if(busy)return;if(v===correct){busy=true;$('mathFeedback').textContent='⭕ 정답!';sfx('right');let token=session;setTimeout(()=>{if(token!==session||mode!=='math')return;round++;if(round===10)awardGame('🎉 10문제 모두 성공!','숫자 놀이를 끝까지 해냈어요!');else nextMath()},850)}else{$('mathFeedback').textContent='💛 다시 해봐!';sfx('wrong')}}
function openKoreanSetup(){show('koreanSetup')}function playKorean(){show('korean');newKoreanRound()}function startKorean(){openKoreanSetup()}function koreanEligible(){let level=$('korLevel').value,levels=level==='easy'?['easy']:level==='normal'?['easy','normal']:['easy','normal','hard'];return words.filter(w=>levels.includes(w[3]))}function newKoreanRound(){session++;round=0;korPool=shuffle(koreanEligible());nextKorean()}
function nextKorean(){busy=false;$('korFeedback').textContent='';$('korProgress').textContent='문제 '+(round+1)+' / 10';if(!korPool.length)korPool=shuffle(koreanEligible());korItem=korPool.pop();let m=$('korMode').value,word=korItem[0],visual=$('korVisual');$('korAnswers').innerHTML='';let options=[];if(m==='picture'){visual.textContent=korItem[1];$('korPrompt').textContent='그림에 맞는 단어를 골라요';korAnswer=word;options=[word,...shuffle(koreanEligible().map(w=>w[0]).filter(w=>w!==word)).slice(0,2)]}else if(m==='same'){visual.textContent=word;visual.className='word';$('korPrompt').textContent='같은 글자를 찾아요';korAnswer=word;options=[word,...shuffle(koreanEligible().map(w=>w[0]).filter(w=>w!==word)).slice(0,2)]}else{let chars=[...word],index=rnd(0,chars.length-1);korAnswer=chars[index];chars[index]='□';visual.textContent=korItem[1]+'  '+chars.join('');options=[korAnswer,...shuffle([...new Set(koreanEligible().flatMap(w=>[...w[0]]).filter(c=>c!==korAnswer))]).slice(0,2)]}if(m!=='same')visual.className='illustration';shuffle(options).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answerKorean(v);$('korAnswers').appendChild(b)});setTimeout(()=>{if(mode==='korean'&&!busy)readKorean()},250)}
function readKorean(text){if(!soundOn||!korItem)return;try{let m=$('korMode').value,t=text||(m==='picture'?'그림에 맞는 단어를 골라보세요.':m==='same'?korItem[0]+'. 같은 글자를 찾아보세요.':'빈칸에 들어갈 글자를 골라보세요.');if(window.KidsVoice){window.KidsVoice.speak(t);return}if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.82;u.pitch=1;u.volume=.9;let vs=window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));if(vs.length)u.voice=vs[0];window.speechSynthesis.speak(u)}catch(e){}}
function answerKorean(v){if(busy)return;if(v===korAnswer){busy=true;$('korFeedback').textContent='⭕ 정답!';sfx('right');readKorean('정답이에요. '+korItem[0]);let token=session;setTimeout(()=>{if(token!==session||mode!=='korean')return;round++;if(round===10)awardGame('🎉 한글 놀이 성공!','10문제 모두 성공! 참 잘했어요!');else nextKorean()},1600)}else{$('korFeedback').textContent='💛 다시 해봐!';sfx('wrong')}}

function awardGame(title,detail){closeOverlay();$('giftTitle').textContent=title;$('giftText').textContent=detail+' 🎁 상자 하나를 골라요!';$('giftDone').classList.add('hidden');let area=$('giftChoices');area.innerHTML='';for(let i=0;i<3;i++){let b=document.createElement('button');b.className='giftBox';b.textContent='🎁';b.setAttribute('aria-label',(i+1)+'번째 선물상자');b.onclick=()=>chooseGift(i);area.appendChild(b)}$('giftOverlay').classList.remove('hidden');sfx('win');confetti()}
function chooseGift(choice){if(!$('giftDone').classList.contains('hidden'))return;let old=ownedToys(),missing=toyCatalog.map((_,i)=>i).filter(i=>!old.includes(i)),pool=missing.length?missing:toyCatalog.map((_,i)=>i),index=pool[rnd(0,pool.length-1)];if(!old.includes(index)){old.push(index);try{localStorage.setItem(toyKey,JSON.stringify(old))}catch(e){}}[...$('giftChoices').children].forEach((b,i)=>{b.disabled=true;b.textContent=i===choice?toyCatalog[index][0]:'🎁';b.style.background=i===choice?'#d6f9d8':''});$('giftText').textContent=(missing.length?'새로운 장난감! ':'다시 만난 장난감! ')+toyCatalog[index][1]+' 획득!';$('giftDone').classList.remove('hidden');sfx('win');confetti()}

const puzzleThemes=[['공룡','🦖','🦕','🐉','🦎','🥚','🦖'],['자동차','🏎️','🚒','🚓','🚜','🚙','🚗'],['동물','🐯','🐻','🦊','🐼','🦁','🐰'],['바다','🐬','🐙','🐢','🦈','🐠','🦀'],['우주','🚀','🪐','👽','🌙','🛸','🌟']];
const puzzleCatalog=puzzleThemes.flatMap(([theme,...items])=>items.map((emoji,i)=>({theme,emoji,name:theme+' '+(i+1)})));
let puzzle=null,puzzleDrag=null,puzzleWinTimer=null;
function puzzleDone(){try{return JSON.parse(localStorage.getItem('kidsplay_puzzle_done')||'[]')}catch(e){return []}}
function puzzleArt(id){let p=puzzleCatalog[id],colors=['#b1f0c8','#b9e0ff','#ffe4b2','#9be7f2','#d0c0ff'],bg=colors[Math.floor(id/6)];let svg='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="600" height="400" fill="'+bg+'"/><circle cx="500" cy="75" r="45" fill="#fff8"/><text x="300" y="265" font-size="170" text-anchor="middle">'+p.emoji+'</text><text x="300" y="365" font-size="35" text-anchor="middle" fill="#304b65">'+p.name+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function openPuzzleGallery(){show('puzzleSelect');const done=puzzleDone();$('puzzleGalleryProgress').textContent='완성 '+done.length+' / 30';$('puzzleGallery').innerHTML='';puzzleCatalog.forEach((p,i)=>{let b=document.createElement('button');b.className='puzzleThumb';b.innerHTML='<img width="100%" height="90" src="'+puzzleArt(i)+'"><small>'+p.theme+' '+(i+1)+(done.includes(i)?' ⭐':'')+'</small>';b.onclick=()=>selectPuzzle(i);$('puzzleGallery').appendChild(b)})}
function openPuzzleBook(){let done=puzzleDone();$('puzzleBookStats').textContent='전체 '+done.length+'/30 · '+puzzleThemes.map((t,i)=>t[0]+' '+done.filter(n=>Math.floor(n/6)===i).length+'/6').join(' · ')+(done.length===30?' 🏆 황금 트로피!':'');let g=$('puzzleBookGrid');g.innerHTML='';puzzleCatalog.forEach((p,i)=>{let b=document.createElement('button');b.className='puzzleThumb';b.innerHTML=done.includes(i)?p.emoji+'<small>'+p.name+'</small>':'🔒<small>미완성</small>';b.onclick=()=>{if(done.includes(i)){$('puzzleBookOverlay').classList.add('hidden');selectPuzzle(i)}};g.appendChild(b)});$('puzzleBookOverlay').classList.remove('hidden')}
function puzzleDims(){return {easy:[3,4],normal:[4,6],hard:[6,6]}[$('puzzleDifficulty').value]}
function selectPuzzle(id){let saved=null;try{saved=JSON.parse(localStorage.getItem('kidsplay_puzzle_save')||'null')}catch(e){}if(saved&&Array.isArray(saved.placed)){if(saved.id===id&&saved.level===$('puzzleDifficulty').value){if(confirm('이어서 퍼즐을 맞출까요? 취소하면 새 퍼즐을 시작해요.')){puzzle=saved;show('puzzlePlay');renderPuzzle();return}}if(!confirm('진행 중인 퍼즐이 있어요. 새 퍼즐을 시작하면 이전 진행 상태가 사라져요. 계속할까요?'))return}puzzle={id,level:$('puzzleDifficulty').value,placed:Array(puzzleDims().reduce((a,b)=>a*b)).fill(false),positions:[]};$('puzzleIntroName').textContent=puzzleCatalog[id].name;$('puzzleIntroImage').innerHTML='<img width="400" height="260" style="max-height:40vh;max-width:60vw" src="'+puzzleArt(id)+'">';$('puzzleIntro').classList.remove('hidden')}
function beginPuzzle(){$('puzzleIntro').classList.add('hidden');show('puzzlePlay');renderPuzzle();savePuzzle()}

function renderPuzzle(){if(!puzzle)return;const [rows,cols]={easy:[3,4],normal:[4,6],hard:[6,6]}[puzzle.level],n=rows*cols,p=puzzleCatalog[puzzle.id];$('puzzleName').textContent=p.name;$('puzzlePreview').innerHTML='<img width="100%" height="85%" src="'+puzzleArt(puzzle.id)+'"><small>완성 그림</small>';const board=$('puzzleBoard');board.style.gridTemplateColumns='repeat('+cols+',1fr)';board.style.gridTemplateRows='repeat('+rows+',1fr)';board.innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.className='slot';d.dataset.slot=i;board.appendChild(d)}let area=$('puzzlePieces');area.innerHTML='';const stage=$('puzzleStage'),bw=stage.clientWidth*.52,bh=stage.clientHeight*.88,w=bw/cols,h=bh/rows;for(let i=0;i<n;i++){let el=document.createElement('div');el.className='puzzlePiece';el.dataset.piece=i;el.style.backgroundImage='url('+puzzleArt(puzzle.id)+')';el.style.backgroundSize=bw+'px '+bh+'px';el.style.backgroundPosition=(-1*(i%cols)*w)+'px '+(-1*Math.floor(i/cols)*h)+'px';el.style.width=w+'px';el.style.height=h+'px';if(puzzle.placed[i]){el.classList.add('fixed');el.style.left=(stage.clientWidth*.24+(i%cols)*w)+'px';el.style.top=(stage.clientHeight*.05+Math.floor(i/cols)*h)+'px'}else{let pos=puzzle.positions[i]||randomPuzzlePosition(i,n);puzzle.positions[i]=pos;el.style.left=(pos[0]*stage.clientWidth)+'px';el.style.top=(pos[1]*stage.clientHeight)+'px';el.addEventListener('pointerdown',puzzlePointerDown)}area.appendChild(el)}updatePuzzleProgress()}
function randomPuzzlePosition(i,n){let side=i%2===0?0:1;return [side===0?Math.random()*.14:.79+Math.random()*.08,Math.random()*.78+.04]}
function puzzlePointerDown(e){if(!puzzle||puzzleDrag)return;e.preventDefault();let el=e.currentTarget,stage=$('puzzleStage'),rect=stage.getBoundingClientRect(),left=parseFloat(el.style.left),top=parseFloat(el.style.top);puzzleDrag={el,index:+el.dataset.piece,x:e.clientX,y:e.clientY,left,top};el.setPointerCapture(e.pointerId);el.style.zIndex=9;el.addEventListener('pointermove',puzzlePointerMove);el.addEventListener('pointerup',puzzlePointerUp,{once:true});el.addEventListener('pointercancel',puzzlePointerUp,{once:true})}
function puzzlePointerMove(e){if(!puzzleDrag)return;let d=puzzleDrag,stage=$('puzzleStage');d.el.style.left=Math.max(0,Math.min(stage.clientWidth-d.el.offsetWidth,d.left+e.clientX-d.x))+'px';d.el.style.top=Math.max(0,Math.min(stage.clientHeight-d.el.offsetHeight,d.top+e.clientY-d.y-18))+'px'}
function puzzlePointerUp(e){if(!puzzleDrag)return;let d=puzzleDrag;puzzleDrag=null;d.el.removeEventListener('pointermove',puzzlePointerMove);let stage=$('puzzleStage'),[rows,cols]={easy:[3,4],normal:[4,6],hard:[6,6]}[puzzle.level],w=stage.clientWidth*.52/cols,h=stage.clientHeight*.88/rows,targetX=stage.clientWidth*.24+(d.index%cols)*w,targetY=stage.clientHeight*.05+Math.floor(d.index/cols)*h,x=parseFloat(d.el.style.left),y=parseFloat(d.el.style.top);if(Math.hypot(x-targetX,y-targetY)<Math.max(35,Math.min(w,h)*.6)){puzzle.placed[d.index]=true;d.el.classList.add('fixed');d.el.style.left=targetX+'px';d.el.style.top=targetY+'px';d.el.style.zIndex=1;sfx('match');updatePuzzleProgress();if(puzzle.placed.every(Boolean)){finishPuzzle();return}}else{d.el.style.left=d.left+'px';d.el.style.top=d.top+'px';d.el.style.zIndex=2}savePuzzle()}
function updatePuzzleProgress(){let count=puzzle.placed.filter(Boolean).length;$('puzzleProgress').textContent=count+' / '+puzzle.placed.length;$('puzzleBar').style.width=(100*count/puzzle.placed.length)+'%'}
function puzzleHint(){if(!puzzle)return;let ids=puzzle.placed.map((x,i)=>x?-1:i).filter(i=>i>=0);if(!ids.length)return;let i=ids[rnd(0,ids.length-1)],el=$('puzzlePieces').querySelector('[data-piece="'+i+'"]'),slot=$('puzzleBoard').children[i];el.classList.add('hinted');slot.style.background='#ffe08a';setTimeout(()=>{el.classList.remove('hinted');slot.style.background=''},2000)}
function puzzleShuffle(){if(!puzzle||puzzleDrag)return;puzzle.positions=Array.from({length:puzzle.placed.length},(_,i)=>puzzle.placed[i]?puzzle.positions[i]:randomPuzzlePosition(i,puzzle.placed.length));renderPuzzle();savePuzzle()}
