name: Build Kids Play APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate embedded game JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          assert scripts, 'Missing embedded game script'
          Path('/tmp/kidsplay-game.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/kidsplay-game.js
      - name: Install 30 puzzle illustrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('KidsPlay_30_Images_Upload_v2.zip')
          dest = Path('app/src/main/assets/puzzles')
          if not archive.exists():
              print('Puzzle ZIP not uploaded yet; using existing SVG fallback')
          else:
              with ZipFile(archive) as z:
                  expected = [f'app/src/main/assets/puzzles/{i:02}.jpg' for i in range(1,31)]
                  missing = [name for name in expected if name not in z.namelist()]
                  if missing:
                      raise SystemExit('Missing puzzle images: ' + ', '.join(missing))
                  dest.mkdir(parents=True, exist_ok=True)
                  for name in expected:
                      (dest / Path(name).name).write_bytes(z.read(name))
                  print('Installed 30 puzzle images for offline APK')
          PY
      - name: Install 60 collectible toy images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('KidsPlay_Toys_60_App.zip')
          dest = Path('app/src/main/assets/toys')
          if archive.exists():
              with ZipFile(archive) as z:
                  expected = [f'toys/{i:02}.webp' for i in range(1,61)]
                  missing = [x for x in expected if x not in z.namelist()]
                  if missing:
                      raise SystemExit('Missing toy images: ' + ', '.join(missing))
                  dest.mkdir(parents=True, exist_ok=True)
                  for name in expected:
                      (dest / Path(name).name).write_bytes(z.read(name))
                  print('Installed 60 collectible toys for offline APK')
          else:
              print('Toy archive not uploaded yet; emoji placeholders remain')
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsPlay-v2.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
